name: "Release: Publish"
run-name: "Release: ${{ github.event.head_commit.message || inputs.tag }}"

on:
  push:
    branches:
      - mainline
    paths:
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: Specify a tag to re-run a release.

concurrency:
  group: release

permissions:
  contents: read

jobs:
  TagRelease:
    uses: aws-deadline/.github/.github/workflows/reusable_tag_release.yml@mainline
    secrets: inherit
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

  UnitTests:
    needs: [TagRelease]
    name: Unit Tests
    uses: ./.github/workflows/code_quality.yml
    with:
      tag: ${{ needs.TagRelease.outputs.tag }}

  IntegrationTests:
    needs: [TagRelease, UnitTests]
    name: ${{ matrix.name}} Integration Tests
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            name: Linux
          - os: windows
            name: Windows
          - os: macos
            name: MacOS
    uses: aws-deadline/.github/.github/workflows/reusable_integration_test.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      tag: ${{ needs.TagRelease.outputs.tag }}
      os: ${{ matrix.os }}

  PreRelease:
      needs: [TagRelease, UnitTests, IntegrationTests]
      uses: aws-deadline/.github/.github/workflows/reusable_prerelease.yml@mainline
      permissions:
        id-token: write
        contents: write
      secrets: inherit
      with:
          tag: ${{ needs.TagRelease.outputs.tag }}

  BuildInstaller:
    needs: [TagRelease, PreRelease]
    uses: aws-deadline/.github/.github/workflows/reusable_build_installers.yml@mainline
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    with:
      ref_type: tags
      ref: ${{ needs.TagRelease.outputs.tag }}
      oses: "['Linux', 'Windows', 'MacOS']"
      environment: release
      project_name: ${{ github.event.repository.name }}

  Publish:
      needs: [TagRelease, BuildInstaller]
      uses: aws-deadline/.github/.github/workflows/reusable_publish_python.yml@mainline
      permissions:
        id-token: write
      secrets: inherit
      with:
          tag: ${{ needs.TagRelease.outputs.tag }}

  IsCondaReady:
    needs: Publish
    runs-on: ubuntu-latest
    environment: release-gate
    name: “Is the Conda Package available in all ProdWaves and have you ran any required manual tests?”
    steps:
      - run: |
         :

  ReleaseInstaller:
    needs: [TagRelease, IsCondaReady]
    uses: aws-deadline/.github/.github/workflows/reusable_release_installers.yml@mainline
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    with:
      tag: ${{ needs.TagRelease.outputs.tag }}
      oses: "['Linux', 'Windows', 'MacOS']"
      project_name: ${{ github.event.repository.name }}

  Release:
      needs: [TagRelease, ReleaseInstaller]
      uses: aws-deadline/.github/.github/workflows/reusable_release.yml@mainline
      secrets: inherit
      permissions:
        id-token: write
        contents: write
      with:
          tag: ${{ needs.TagRelease.outputs.tag }}

  # PyPI does not support reusable workflows yet
  # # See https://github.com/pypi/warehouse/issues/11096
  PublishToPyPI:
    needs: [TagRelease, Release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.TagRelease.outputs.tag }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ needs.TagRelease.outputs.build-python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade hatch "virtualenv<21"
      - name: Build
        run: hatch -v build
      # # See https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
