# The scenes the PDG integ tests cook, each with the result its cook must give.
#
# A scene is built by a script in scene_builders/ when the test runs (source: builder),
# or is a .hip file in the folder PDG_TEST_SCENES_DIR names (source: external), saved
# there under the name given here and pinned by its SHA-256.
#
# Fields:
#   id           the pytest ID, lowercase snake_case
#   kind         cook: the scene must cook as a job | refusal: it must be refused
#   set          smoke: every run | full: only `hatch run integ:test_pdg_full`
#   cook_node    the node to cook; omitted means the TOP network's display node
#   requires     what the farm's workers need, named in failure messages
#   max_minutes  how long the whole cook may take before the test stops it and cancels
#                any job it made
#   expect       outcome is cook.json's "outcome"; steps must equal the snapshot's
#                steps exactly; host_requirements must be held by every step;
#                refusals must pair one to one with the refusals the cook logs, each
#                with the same scenario and a subject that contains subject_contains
#
# Expected steps and refusals were measured with a generate and the scheduler's
# validation in hython.
version: 1
scenes:
  - id: minimal_cook
    kind: cook
    set: smoke
    source:
      builder: minimal_cook.py
    requires: []
    max_minutes: 27                     # 2.7 times the slowest of 3 measured minimal cooks, 9.8 min
    expect:
      outcome: succeeded
      steps:
        - {name: write_geometry_ropfetch1, task_count: 5, declares_outputs: true}
        - {name: copy_geometry, task_count: 5, declares_outputs: true}
        - {name: merge_geometry_ropfetch1, task_count: 1, declares_outputs: true}

  - id: minimal_cook_host_requirements
    kind: cook
    set: smoke
    source:
      builder: minimal_cook_host_requirements.py
    requires: [linux workers]
    max_minutes: 27                     # 2.7 times the slowest of 3 measured minimal cooks, 9.8 min
    expect:
      outcome: succeeded
      steps:
        - {name: write_geometry_ropfetch1, task_count: 5, declares_outputs: true}
        - {name: copy_geometry, task_count: 5, declares_outputs: true}
        - {name: merge_geometry_ropfetch1, task_count: 1, declares_outputs: true}
      host_requirements:
        attributes: [{name: attr.worker.os.family, anyOf: [linux]}]

  - id: pyro_bonfire_small
    kind: cook
    set: smoke
    source:
      external: pyroBonfire_openh264.hip
      sha256: 2b2439e9b8806b903f3b46fcd7f1382569958942207b27d2894ec24e554cc083
    requires: [imagemagick, hffmpeg]
    max_minutes: 45                     # 2.7 times the slowest measured cook, 16.7 min
    expect:
      outcome: succeeded
      steps:
        - {name: ropfetch_pyro_cache, task_count: 6, declares_outputs: true}
        - {name: ropfetch_sparks_cache, task_count: 6, declares_outputs: true}
        - {name: ropfetch_karma, task_count: 6, declares_outputs: true}
        - {name: overlaytext_pyro_bonfire_ropfetch1, task_count: 6, declares_outputs: true}
        - {name: mosaic_bonfire, task_count: 1, declares_outputs: true}
        - {name: bonfire_montage_video, task_count: 1, declares_outputs: false}

  # The full set has not been cooked on a farm. Its 180-minute limits are a judgment,
  # not a measurement: too low cancels a good cook, too high holds the queue longer on a
  # cook that hangs.
  - id: pyro_bonfire_large
    kind: cook
    set: full
    source:
      external: pyroBonfire_DEMO.hip
      sha256: 7efe83172569816399242f4794ac258a4fa49c4e3721da65555c5107b6b2cb1b
    requires: [imagemagick, hffmpeg]
    max_minutes: 180                    # a judgment, not measured
    expect:
      outcome: succeeded
      steps:
        - {name: ropfetch_pyro_cache, task_count: 720, declares_outputs: true}
        - {name: ropfetch_sparks_cache, task_count: 720, declares_outputs: true}
        - {name: ropfetch_karma, task_count: 480, declares_outputs: true}
        - {name: overlaytext_pyro_bonfire_ropfetch1, task_count: 480, declares_outputs: true}
        - {name: mosaic_bonfire, task_count: 80, declares_outputs: true}
        - {name: bonfire_montage_video, task_count: 1, declares_outputs: false}

  - id: orca_guided_ocean
    kind: cook
    set: full
    source:
      external: orca_guided_ocean_v31.hip
      sha256: 96e4084050e3983904056a502f9e2f8d56c8f0af9ca86f5e6e6501c57911d011
    cook_node: /obj/topnet1/guided_ocean   # the display node cooks only 2 of the 11 steps
    requires: []                        # not known until a farm cook
    max_minutes: 180                    # a judgment, not measured
    expect:
      outcome: succeeded
      steps:
        - {name: boat_anim, task_count: 1, declares_outputs: true}
        - {name: wavetank, task_count: 479, declares_outputs: true}
        - {name: flip_sim, task_count: 240, declares_outputs: true}
        - {name: mask, task_count: 240, declares_outputs: true}
        - {name: spectra, task_count: 1, declares_outputs: true}
        - {name: surfaced, task_count: 240, declares_outputs: true}
        - {name: ww_source, task_count: 240, declares_outputs: true}
        - {name: ww_sim, task_count: 240, declares_outputs: true}
        - {name: ww_volumes, task_count: 240, declares_outputs: true}
        - {name: ropusd1_ropfetch1, task_count: 239, declares_outputs: true}
        - {name: guided_ocean, task_count: 239, declares_outputs: true}

  # The scenes that must be refused. Each built one is the smallest graph that triggers
  # one refusal; the two downloaded ones are artist scenes the scheduler refuses. Their
  # max_minutes is 2.7 times the slowest of 5 measured farm runs of the refusal tests,
  # rounded up to a whole minute. A test's time includes building the scene and the job
  # search, so it is longer than the cook alone.

  - id: dynamic_node
    kind: refusal
    set: smoke
    source:
      builder: dynamic_node.py
    max_minutes: 1                      # slowest measured test 9.4 s
    expect:
      outcome: refused
      refusals:
        - {scenario: dynamic_node, subject_contains: write_when_cooked}

  - id: in_process_node
    kind: refusal
    set: smoke
    source:
      builder: in_process_node.py
    max_minutes: 1                      # slowest measured test 8.1 s
    expect:
      outcome: refused
      refusals:
        - {scenario: in_process_node, subject_contains: list_in_process}

  - id: in_process_step
    kind: refusal
    set: smoke
    source:
      builder: in_process_step.py
    max_minutes: 1                      # slowest measured test 8.3 s
    expect:
      outcome: refused
      refusals:
        - {scenario: in_process_step, subject_contains: write_in_process}

  - id: runtime_file_unproduced
    kind: refusal
    set: smoke
    source:
      builder: runtime_file_unproduced.py
    max_minutes: 1                      # slowest measured test 8.2 s
    expect:
      outcome: refused
      refusals:
        - {scenario: runtime_file_unproduced, subject_contains: never_written.bgeo.sc}

  - id: rop_batch
    kind: refusal
    set: smoke
    source:
      builder: rop_batch.py
    max_minutes: 1                      # slowest measured test 8.6 s
    expect:
      outcome: refused
      refusals:
        - {scenario: rop_batch, subject_contains: write_batched}

  - id: multiple_schedulers
    kind: refusal
    set: smoke
    source:
      builder: multiple_schedulers.py
    max_minutes: 1                      # slowest measured test 7.9 s
    expect:
      outcome: refused
      refusals:
        - {scenario: multiple_schedulers, subject_contains: write_locally}

  - id: service_node
    kind: refusal
    set: smoke
    source:
      builder: service_node.py
    max_minutes: 1                      # slowest measured test 8.2 s
    expect:
      outcome: refused
      refusals:
        - {scenario: service_node, subject_contains: write_as_service}

  - id: quota_exceeded
    kind: refusal
    set: smoke
    source:
      builder: quota_exceeded.py
    max_minutes: 1                      # slowest measured test 10.4 s
    expect:
      outcome: refused
      refusals:
        - {scenario: quota_exceeded, subject_contains: write_too_many}
        - {scenario: quota_exceeded, subject_contains: "this cook"}

  - id: output_outside_cook
    kind: refusal
    set: smoke
    source:
      builder: output_outside_cook.py
    max_minutes: 1                      # slowest measured test 8.2 s
    expect:
      outcome: refused
      refusals:
        - {scenario: output_outside_cook, subject_contains: write_outside}

  - id: local_file_unreachable
    kind: refusal
    set: smoke
    source:
      builder: local_file_unreachable.py
    max_minutes: 1                      # slowest measured test 8.3 s
    expect:
      outcome: refused
      refusals:
        - {scenario: local_file_unreachable, subject_contains: "read_missing parm 'file'"}

  - id: attribute_as_variable
    kind: refusal
    set: smoke
    source:
      builder: attribute_as_variable.py
    max_minutes: 1                      # slowest measured test 8.1 s
    expect:
      outcome: refused
      refusals:
        - {scenario: attribute_as_variable, subject_contains: "parm 'sopoutput'"}

  - id: cached_outputs
    kind: refusal
    set: smoke
    source:
      builder: cached_outputs.py
    max_minutes: 1                      # slowest measured test 7.9 s
    expect:
      outcome: refused
      refusals:
        - {scenario: cached_outputs, subject_contains: write_cached}

  - id: unsaved_scene
    kind: refusal
    set: smoke
    source:
      builder: unsaved_scene.py
      saved: false                      # cook_scene_in_hython.py builds it and cooks it unsaved
    max_minutes: 1                      # slowest measured test 4.0 s
    expect:
      outcome: refused
      refusals:
        - {scenario: unsaved_scene, subject_contains: untitled.hip}

  - id: no_farm_work
    kind: refusal
    set: smoke
    source:
      builder: no_farm_work.py
    max_minutes: 1                      # slowest measured test 7.7 s
    expect:
      outcome: refused
      refusals:
        - {scenario: no_farm_work, subject_contains: items}

  - id: city_builder
    kind: refusal
    set: smoke
    source:
      external: city_builder_DEMO.hip
      sha256: 115ca06763f7df2a8e70368a2e5365efdac4f8ebd4510938c5ed9af427385f4f
    max_minutes: 1                      # slowest measured test 4.2 s
    expect:
      outcome: refused
      refusals:
        - {scenario: in_process_step, subject_contains: filecopy_compiled}
        - {scenario: in_process_step, subject_contains: filecopy_compiled1}
        - {scenario: multiple_schedulers, subject_contains: city_geo_ropfetch1}

  - id: volume_advection
    kind: refusal
    set: smoke
    source:
      external: pdg_volume_advection_01.hip
      sha256: 5b5cb93efeda97d512003a22358ed4dba0b8f3ba68aa2da9814ef174548a131a
    max_minutes: 1                      # slowest measured test 4.7 s
    expect:
      outcome: refused
      refusals:
        - {scenario: attribute_as_variable, subject_contains: "mantra1 parm 'vm_picture'"}
